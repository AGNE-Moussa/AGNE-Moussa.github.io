stages:
  - quality

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

lint:
  stage: quality
  script:
    - npm run lint

build:
  stage: quality
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week
