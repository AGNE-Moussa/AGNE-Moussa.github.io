<!doctype html>
<!--
  Source de l'image d'aperçu des réseaux sociaux (balise og:image de index.html).
  Pour régénérer public/og-image.png après une modification (PowerShell, depuis la racine) :
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars `
    --window-size=1200,630 --screenshot="$PWD\public\og-image.png" "$PWD\og\og-image.html"
  Les polices viennent de node_modules : lancer npm install au préalable.
-->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Image d'aperçu</title>
<style>
  @font-face { font-family: 'Plex'; font-weight: 300; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex'; font-weight: 500; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex'; font-weight: 600; src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }

  :root { --ink: #0e2131; --ink-3: #1b3950; --dot: #eaf1f4; --teal: #7fc4c0; --muted-2: #c7d6de; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Plex', sans-serif; color: var(--dot);
    background: radial-gradient(ellipse 60% 80% at 22% 45%, var(--ink-3), var(--ink) 70%);
    display: grid; grid-template-columns: 330px 1fr; gap: 56px; align-items: center; padding: 0 90px;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(234, 241, 244, .09) 1px, transparent 1.4px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 70% at 40% 50%, #000 30%, transparent 80%);
  }
  .figure { position: relative; width: 330px; height: 420px; }
  .text { position: relative; }
  .url { font-family: 'Plex Mono', monospace; font-size: 22px; color: var(--teal); margin: 0 0 18px; }
  h1 { font-size: 76px; font-weight: 600; letter-spacing: -.02em; line-height: 1; margin: 0 0 22px; }
  .tagline { font-size: 34px; font-weight: 300; line-height: 1.25; color: var(--muted-2); margin: 0 0 34px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .chips li { font-size: 21px; padding: 7px 18px; border-radius: 999px; background: rgba(234, 241, 244, .08); border: 1px solid rgba(234, 241, 244, .14); color: var(--muted-2); }
  .chips li.accent { color: var(--ink); background: var(--teal); border-color: var(--teal); font-weight: 500; }
</style>
</head>
<body>
  <!-- Silhouette en points lumineux, reprise du favicon -->
  <svg class="figure" viewBox="6 2 22 28" aria-hidden="true">
    <defs>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation=".7" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <g filter="url(#glow)" fill="#EAF1F4">
      <circle cx="16.5" cy="6.5" r="1" /><circle cx="12.5" cy="12" r=".75" /><circle cx="20" cy="12" r=".75" />
      <circle cx="11" cy="17.5" r=".75" /><circle cx="21.5" cy="17" r=".75" /><circle cx="14" cy="18.5" r=".75" />
      <circle cx="18.5" cy="18.5" r=".75" />
    </g>
    <g filter="url(#glow)" fill="#7FC4C0"><circle cx="12" cy="25.5" r=".8" /><circle cx="21" cy="25" r=".8" /></g>
  </svg>
  <div class="text">
    <p class="url">agne-moussa.github.io</p>
    <h1>Moussa Agne</h1>
    <p class="tagline">Des applications web fiables,<br />du back-end à l'interface</p>
    <ul class="chips">
      <li>Python</li><li>Symfony</li><li>React</li><li class="accent">Workflows IA</li>
    </ul>
  </div>
</body>
</html>
