<!doctype html>
<!--
  Source de la bannière LinkedIn (1584 x 396, rendue en x2 pour la netteté).
  Pour régénérer og/linkedin-banner.png (PowerShell, depuis la racine) :
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars `
    --force-device-scale-factor=2 --window-size=1584,396 `
    --screenshot="$PWD\og\linkedin-banner.png" "$PWD\og\linkedin-banner.html"
  Zones à respecter : la photo de profil masque le bas à gauche, le mobile rogne les côtés.
  Les polices viennent de node_modules : lancer npm install au préalable.
-->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Bannière LinkedIn</title>
<style>
  @font-face { font-family: 'Jost'; font-weight: 300; src: url('../node_modules/@fontsource/jost/files/jost-latin-300-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 400; src: url('../node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 500; src: url('../node_modules/@fontsource/jost/files/jost-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Jost'; font-weight: 600; src: url('../node_modules/@fontsource/jost/files/jost-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400; src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }

  :root {
    --bg: #0a1520; --text: #eaf3fb; --text-2: #b9c9d6; --muted: #8299ab;
    --blue: #2fa8ff; --blue-2: #66c2ff; --blue-deep: #1475c2; --pink: #e8285f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; }
  body {
    position: relative; font-family: 'Jost', sans-serif; color: var(--text);
    background:
      radial-gradient(ellipse 30% 90% at 12% 100%, rgba(47, 168, 255, .22), transparent 70%),
      radial-gradient(ellipse 35% 80% at 92% 0%, rgba(47, 168, 255, .14), transparent 70%),
      linear-gradient(160deg, #0f2030, var(--bg) 60%);
  }
  /* Trame de points, comme sur le site */
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(140, 200, 255, .12) 1px, transparent 1.5px);
    background-size: 28px 28px;
    mask-image: linear-gradient(90deg, transparent 5%, #000 40%, #000 75%, transparent 100%);
  }
  /* Halo et anneau derrière la photo de profil (bas gauche) */
  .halo {
    position: absolute; left: 30px; top: 230px; width: 300px; height: 300px;
    border-radius: 58% 42% 46% 54% / 52% 44% 56% 48%;
    background: radial-gradient(circle at 35% 35%, var(--blue-2), var(--blue-deep) 70%);
    filter: blur(40px); opacity: .45;
  }
  .ring {
    position: absolute; left: 10px; top: 200px; width: 340px; height: 340px;
    border-radius: 58% 42% 46% 54% / 52% 44% 56% 48%;
    border: 2px solid rgba(234, 243, 251, .55); transform: rotate(-14deg);
  }
  .ring.two { left: -10px; top: 185px; width: 380px; height: 380px; border-color: rgba(47, 168, 255, .35); transform: rotate(18deg); }

  /* Cadre lumineux du site, en filet fin */
  .frame {
    position: absolute; inset: 18px; border-radius: 22px;
    border: 1.5px solid rgba(102, 194, 255, .35);
    box-shadow: inset 0 0 70px -40px rgba(47, 168, 255, .5);
  }

  .content { position: absolute; left: 560px; right: 110px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .prompt { font-family: 'Plex Mono', monospace; font-size: 19px; color: var(--blue-2); margin: 0 0 14px; }
  .prompt b { color: var(--pink); font-weight: 400; }
  h1 { font-size: 50px; font-weight: 600; line-height: 1.08; letter-spacing: -.015em; margin: 0 0 12px; }
  h1 span { color: var(--blue); text-shadow: 0 0 28px rgba(47, 168, 255, .45); }
  .sub { font-size: 23px; font-weight: 300; color: var(--text-2); margin: 0 0 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .chips li {
    font-size: 17px; font-weight: 500; padding: 5px 15px; border-radius: 999px;
    background: rgba(140, 200, 255, .07); border: 1px solid rgba(140, 200, 255, .22); color: var(--text-2);
  }
  .chips li.accent { background: var(--pink); border-color: var(--pink); color: #fff; box-shadow: 0 0 18px -4px rgba(232, 40, 95, .7); }

  .url { position: absolute; right: 48px; bottom: 36px; font-family: 'Plex Mono', monospace; font-size: 16px; color: var(--muted); }
  .url::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); margin-right: 10px; vertical-align: 1px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="halo"></div>
  <div class="ring two"></div>
  <div class="ring"></div>

  <div class="content">
    <p class="prompt">&gt; développeur full stack <b>·</b> ingénieur de recherche au CNRS</p>
    <h1>Des applications web <span>fiables</span>,<br />du back-end à l'interface.</h1>
    <p class="sub">Et des workflows de développement assistés par agents IA.</p>
    <ul class="chips">
      <li>Python</li><li>Symfony</li><li>Django</li><li>React</li><li>PostgreSQL</li><li>Docker</li>
      <li class="accent">Claude Code</li>
    </ul>
  </div>

  <p class="url">agne-moussa.github.io</p>
</body>
</html>
